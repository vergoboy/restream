# Noisy - public RTMP ingest.
#
# Included at the top level of /etc/nginx/nginx.conf, next to http{} and
# events{}. This is the only Noisy port exposed to the internet.
#
# Every publish is authenticated by the control panel before a single byte is
# forwarded to the restreamer. The expected key is NOT written here: the panel
# holds it, so rotating it takes effect immediately with no reload.
#
# The restreamer reads this application over the docker bridge gateway as an
# ordinary RTMP client, so no relay is configured here (see the note in the
# application block below).

rtmp {
    server {
        # 1935 is already bound by the host's MediaMTX, which is left alone.
        # IPv4 only on purpose: this box has net.ipv6.bindv6only=0, so a
        # second "listen [::]:19350" would collide with the IPv4 socket and
        # make every nginx reload fail with EADDRINUSE.
        listen 19350;
        chunk_size 4096;
        ping 30s;

        application noisy {
            live on;
            record off;

            # nginx-rtmp 1.2.2 has no on_publish_post; on_publish issues a GET
            # with the stream args in the query string, which is what the panel
            # gate below is built to read. The gate must answer with an EMPTY
            # 2xx body: nginx-rtmp reads a non-empty 2xx body as a redirect to
            # a stream of that name, which closes the session it just accepted.
            on_publish http://127.0.0.1:18081/noisy/internal/rtmp/publish;

            # There is deliberately no `push` here. Debian's libnginx-mod-rtmp
            # ships ngx_rtmp_auto_push_module instead of ngx_rtmp_push_module:
            # it accepts the `push` directive and opens the TCP connection, but
            # never relays a byte, so a stream configured that way looks alive
            # and delivers nothing. The restreamer therefore reads this app
            # directly as an RTMP client, which is also why the stream name here
            # is the ingest key.
        }
    }
}

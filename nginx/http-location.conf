# Noisy - control panel on https://vergoboy.ir/noisy/
#
# Included from inside the existing vergoboy.ir server block. Everything the
# panel serves is generated per request and authenticated, so nothing is
# cached and the upstream is loopback only.

location = /noisy {
    return 308 /noisy/;
}

# Static assets are served by nginx, not proxied to the panel. The panel has
# no static route of its own, so anything sent to the app under this prefix
# 404s -- which renders the whole panel unstyled while every page still
# returns 200. ^~ is required: it wins over the /noisy/ prefix below.
#
# These are the stylesheet and the small amount of JS for the login page and
# dashboard. They are not secret (the login page itself is public), but they
# are still not cached hard, so a panel update takes effect on reload instead
# of lingering in someone's browser.
location ^~ /noisy/static/ {
    alias /opt/noisy/app/static/;

    # Refuse anything that is not a plain file, so a crafted path cannot walk
    # out of the static directory.
    autoindex off;
    disable_symlinks on;

    access_log off;
    expires -1;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location /noisy/ {
    proxy_pass http://127.0.0.1:18081;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # The ingest key and the YouTube stream key both arrive in POST bodies.
    client_max_body_size 64k;
    client_body_buffer_size 16k;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_buffering off;
    proxy_intercept_errors off;
}
